name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q CustomLock.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: CustomLock
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          echo "=============== ERRORS ==============="
          grep -E "^e: |error:|FAILURE|What went wrong" -A2 build.log | head -60
          echo "======================================"
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: CustomLock-debug-apk
          path: CustomLock/app/build/outputs/apk/debug/app-debug.apk
